[project]
name = "cmcoder"
version = "0.1.0"
description = "Agentic coding assistant for the terminal and VS Code, for OpenAI-compatible model endpoints"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "typer>=0.12",
    "rich>=13.7",
    "prompt-toolkit>=3.0.43",
    "truststore>=0.9",
    "keyring>=25",
    "pathspec>=0.12",
]

[project.scripts]
cmcoder = "cmcoder.cli.main:run"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "pyright>=1.1.370",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cmcoder"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Leaked subprocess/pipe transports must fail the run, not just warn.
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Eval task repos are fixtures for the agent, not project code.
extend-exclude = ["evals/tasks", "evals/.runs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC"]
ignore = ["E501", "SIM105", "ASYNC109"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
