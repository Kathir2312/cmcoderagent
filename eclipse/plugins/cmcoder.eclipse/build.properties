# The shared IDE core (clients/jvm-core) is compiled into this bundle from its
# own source folder; the shared chat panel's built files are copied into
# panel/ by the build (pom.xml). Neither is kept here.
source.. = src/,\
           ../../../clients/jvm-core/src/main/java/
output.. = target/classes/
bin.includes = META-INF/,\
               .,\
               plugin.xml,\
               icons/,\
               panel/
