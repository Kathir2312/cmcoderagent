name: Packaging scripts

# The one-command scripts people run on their own build machines
# (packaging/package-*.ps1 and .sh, docs/building/), run for real as they run
# them: Windows PowerShell 5.1 on Windows, bash on macOS and Linux. Each makes
# its package with cmcoder inside (built and run with no Python in reach) and
# checks the program is in the file. The files handed out come from the
# Release build; these aren't uploaded.
on:
  workflow_dispatch:
  push:
    branches: ["**"]
    paths:
      - "packaging/**"
      - "visualstudio/build-vsix.ps1"
      - "netbeans/pom.xml"
      - "eclipse/pom.xml"
      - "jetbrains/build.gradle.kts"
      - "tests/test_packaging_scripts.py"
      - ".github/workflows/packaging-scripts.yml"

# A newer push to the same branch replaces a run still going.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only token. No caches: a build machine starts without them too.
permissions:
  contents: read

jobs:
  scripts:
    name: scripts (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: linux-x64 }
          - { os: windows-latest, target: win32-x64 }
          - { os: macos-latest, target: darwin-arm64 }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: bubblewrap (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: false
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          package-manager-cache: false
          node-version: 22
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          gradle-version: "9.8.1"
          cache-disabled: true

      - name: Every package, one command (bash)
        if: runner.os != 'Windows'
        run: bash packaging/package-all.sh
      - name: Every package, one command (Windows PowerShell 5.1, as on build PCs)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File packaging\package-all.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # The Eclipse archive holds every platform's cmcoder. Here the others are
      # stand-ins (this run makes nothing to hand out), given as a folder and as
      # a zip, as people give them: the script takes both.
      - name: Eclipse, with the other platforms' cmcoder given (Linux)
        if: runner.os == 'Linux'
        run: |
          fake="$RUNNER_TEMP/fake"
          mkdir -p "$fake/win/_internal" "$fake/mac/cmcoder/_internal"
          echo stand-in > "$fake/win/cmcoder.exe"
          echo stand-in > "$fake/mac/cmcoder/cmcoder"
          (cd "$fake/mac" && uv run --no-sync python -m zipfile -c "$fake/mac.zip" cmcoder)
          (cd dist && uv run --no-sync python -m zipfile -c "$fake/linux.zip" cmcoder)
          bash packaging/package-eclipse.sh --win32-x64 "$fake/win" \
            --darwin-arm64 "$fake/mac.zip" --linux-x64 "$fake/linux.zip"
          test -f dist/cmcoder-eclipse.zip
      - name: Eclipse, this platform only (macOS)
        if: runner.os == 'macOS'
        run: |
          bash packaging/package-eclipse.sh --one-platform --use-built
          test -f dist/cmcoder-eclipse-TRYOUT-darwin-arm64-only.zip
      - name: Eclipse, with the other platforms' cmcoder given (Windows PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $fake = Join-Path $env:RUNNER_TEMP "fake"
          New-Item -ItemType Directory -Force "$fake\mac\cmcoder\_internal", "$fake\linux\cmcoder\_internal" | Out-Null
          Set-Content "$fake\mac\cmcoder\cmcoder" "stand-in"
          Set-Content "$fake\linux\cmcoder\_internal\x" "stand-in"
          Set-Content "$fake\linux\cmcoder\cmcoder" "stand-in"
          Compress-Archive -Path "$fake\linux\cmcoder" -DestinationPath "$fake\linux.zip"
          powershell -NoProfile -ExecutionPolicy Bypass -File packaging\package-eclipse.ps1 -UseBuilt `
            -DarwinArm64 "$fake\mac" -LinuxX64 "$fake\linux.zip"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path dist\cmcoder-eclipse.zip)) { throw "no dist\cmcoder-eclipse.zip" }

      - name: The files the scripts made
        if: ${{ !cancelled() }}
        shell: bash
        run: ls -l dist/*.zip dist/*.nbm dist/*.vsix vscode/*.vsix 2>/dev/null || true
