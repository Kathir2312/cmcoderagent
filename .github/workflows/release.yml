name: Release build

# The standalone cmcoder (PyInstaller, no Python needed), the terminal
# package and a VS Code extension per platform with it inside, and the Eclipse
# plugin. Each build is tested as users run it, with no Python in reach
# (packaging/no_python.py: developers' PCs have none); on Linux the extension
# is also run in a real VS Code with the bundled cmcoder, and the Eclipse plugin
# runs in a real Eclipse on every platform with its bundled cmcoder, as does
# the NetBeans plugin in a real NetBeans. Artifacts: cmcoder-<target> (the
# program folder), cmcoder-terminal-<target> (the zip with install scripts),
# cmcoder-<target>.vsix, cmcoder-netbeans-<target>.nbm and cmcoder-eclipse
# (the update site archive, every platform in one).
#
# Then the release bundle (packaging/bundle.py): every file in one folder with
# README-FIRST.txt, GATE-REPORT.md and SHA256SUMS.txt, made only when every
# job passed. On a version tag (v0.6.0, ...) it's also a GitHub release.
on:
  workflow_dispatch:
  push:
    # Both, or GitHub runs it for only one kind of push; path filters apply to branches only.
    branches: ["**"]
    tags: ["v*"]
    paths:
      - "src/**"
      - "packaging/**"
      - "branding/**"
      - "vscode/**"
      - "clients/**"
      - "eclipse/**"
      - "visualstudio/**"
      - "netbeans/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/release.yml"

# A newer push to the same branch replaces a run still going (tags each have their own).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: linux-x64 }
          - { os: windows-latest, target: win32-x64 }
          - { os: macos-latest, target: darwin-arm64 }
    steps:
      - uses: actions/checkout@v4
      - name: bubblewrap (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: uv sync
      - name: Build the standalone cmcoder
        run: uv run --with pyinstaller python packaging/build.py
      - name: Test it as users run it (no Python in reach)
        shell: bash
        run: |
          exe=dist/cmcoder/cmcoder; [ "$RUNNER_OS" = Windows ] && exe=dist/cmcoder/cmcoder.exe
          CMCODER_TEST_BINARY=$exe CMCODER_TEST_NO_PYTHON=1 uv run pytest -q tests/test_standalone.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: The IDE core for Eclipse/NetBeans with this cmcoder (no Python in reach)
        shell: bash
        run: |
          exe=$PWD/dist/cmcoder/cmcoder; [ "$RUNNER_OS" = Windows ] && exe=$PWD/dist/cmcoder/cmcoder.exe
          mvn=mvn; [ "$RUNNER_OS" = Windows ] && mvn=mvn.cmd
          export CMCODER_TEST_PYTHON="$(uv run python -c 'import sys; print(sys.executable)')"
          CMCODER_TEST_BINARY=$exe uv run python packaging/no_python.py run -- $mvn -B -f clients/jvm-core/pom.xml verify
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: The Visual Studio core with this cmcoder (no Python in reach)
        shell: bash
        run: |
          exe=$PWD/dist/cmcoder/cmcoder; [ "$RUNNER_OS" = Windows ] && exe=$PWD/dist/cmcoder/cmcoder.exe
          export CMCODER_TEST_PYTHON="$(uv run python -c 'import sys; print(sys.executable)')"
          dotnet build visualstudio/test/Cmcoder.Core.Tests -c Release
          CMCODER_TEST_BINARY=$exe uv run python packaging/no_python.py run -- dotnet test visualstudio/test/Cmcoder.Core.Tests -c Release --no-build
      - name: The Eclipse plugin in a real Eclipse, with this cmcoder inside (no Python in reach)
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux) frag=linux.x86_64; sudo apt-get install -y libwebkit2gtk-4.1-0 ;;
            Windows) frag=win32.x86_64 ;;
            macOS) frag=macosx.aarch64 ;;
          esac
          cp -RL dist/cmcoder eclipse/fragments/cmcoder.eclipse.$frag/bin/cmcoder  # links as files
          (cd clients/web-panel && npm ci && npm run build)
          mvn=mvn; [ "$RUNNER_OS" = Windows ] && mvn=mvn.cmd
          x=(); [ "$RUNNER_OS" = Linux ] && x=(xvfb-run -a -s "-screen 0 1600x1000x24")
          export CMCODER_TEST_PYTHON="$(uv run python -c 'import sys; print(sys.executable)')"
          export CMCODER_GATE_SHOTS="$RUNNER_TEMP/gate-shots"
          cd eclipse
          CMCODER_TEST_BUNDLED=1 "${x[@]}" uv run python ../packaging/no_python.py run -- $mvn -B verify
          rm -rf fragments/cmcoder.eclipse.$frag/bin/cmcoder
      - name: NetBeans (the newest release; cached)
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/netbeans-31
          key: netbeans-31-bin
      - name: The NetBeans plugin in a real NetBeans, with this cmcoder inside (no Python in reach)
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux) plat=linux ;;
            Windows) plat=win ;;
            macOS) plat=mac-aarch64 ;;
          esac
          nb="$RUNNER_TEMP/netbeans-31"
          if [ ! -x "$nb/netbeans/bin/netbeans" ]; then
            mkdir -p "$nb" && cd "$nb"
            # downloads.apache.org is fast but holds only the newest release; the archive has all, slowly.
            for base in https://downloads.apache.org/netbeans/netbeans/31 https://archive.apache.org/dist/netbeans/netbeans/31; do
              curl -fsSL --retry 3 -O $base/netbeans-31-bin.zip && curl -fsSL -O $base/netbeans-31-bin.zip.sha512 && break
            done
            [ "$(cut -d' ' -f1 netbeans-31-bin.zip.sha512)" = "$( (sha512sum netbeans-31-bin.zip 2>/dev/null || shasum -a 512 netbeans-31-bin.zip) | cut -d' ' -f1)" ]
            if [ "$RUNNER_OS" = Windows ]; then 7z x -bd -y netbeans-31-bin.zip > /dev/null; else unzip -q netbeans-31-bin.zip; fi
            rm netbeans-31-bin.zip
            cd "$GITHUB_WORKSPACE"
          fi
          rm -rf netbeans/bin && mkdir -p netbeans/bin && cp -RL dist/cmcoder netbeans/bin/cmcoder  # links as files
          mvn=mvn; [ "$RUNNER_OS" = Windows ] && mvn=mvn.cmd
          (cd netbeans && $mvn -B -q package -Dplatform=$plat -Pgate && mv target/cmcoder-netbeans-${{ matrix.target }}.nbm ../gate.nbm)
          (cd netbeans && $mvn -B -q package -Dplatform=$plat && cp target/cmcoder-netbeans-${{ matrix.target }}.nbm ../dist/)
          py="$(uv run python -c 'import sys; print(sys.executable)')"
          x=(); [ "$RUNNER_OS" = Linux ] && x=(xvfb-run -a -s "-screen 0 1600x1000x24")
          # Git's bash by its full path: started from Python, Windows finds its own bash.exe (WSL) first.
          sh=bash; [ "$RUNNER_OS" = Windows ] && sh="$(cygpath -w /usr/bin/bash.exe)"
          CMCODER_GATE_SHOTS="$RUNNER_TEMP/gate-shots" "${x[@]}" uv run python packaging/no_python.py run -- "$sh" netbeans/gate/run-gate.sh \
            --nbm gate.nbm --netbeans "$nb/netbeans" --python "$py" --jdk "$JAVA_HOME"
      - uses: actions/upload-artifact@v4
        with:
          name: cmcoder-netbeans-${{ matrix.target }}.nbm
          path: dist/cmcoder-netbeans-${{ matrix.target }}.nbm
      - name: The Visual Studio extension, with this cmcoder inside (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item -Recurse dist/cmcoder visualstudio/src/Cmcoder.VisualStudio/bin/cmcoder
          $vsix = ./visualstudio/build-vsix.ps1 | Select-Object -Last 1
          $gate = ./visualstudio/build-vsix.ps1 -Gate | Select-Object -Last 1
          Copy-Item $vsix dist/cmcoder-visualstudio.vsix
          "GATE_VSIX=$gate" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: The Visual Studio extension in a real Visual Studio, with its cmcoder (no Python in reach)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          py="$(uv run python -c 'import sys; print(sys.executable)')"
          uv run python packaging/no_python.py run -- powershell -NoProfile -ExecutionPolicy Bypass \
            -File visualstudio/gate/run-gate.ps1 -Vsix "$GATE_VSIX" -Python "$py"
      - name: Screenshots from the IDE gates (chat, a diff, the navigator)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-screenshots-${{ matrix.target }}
          path: ${{ runner.temp }}/gate-shots
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: failure() && runner.os == 'Windows'
        with:
          name: vs-gate-screen
          path: ${{ runner.temp }}/vs-gate-screen.png
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: cmcoder-visualstudio.vsix
          path: dist/cmcoder-visualstudio.vsix
      - name: The terminal package (install, update, run, uninstall; no Python in reach)
        shell: bash
        run: |
          uv run python packaging/terminal.py
          exe=dist/cmcoder/cmcoder; [ "$RUNNER_OS" = Windows ] && exe=dist/cmcoder/cmcoder.exe
          CMCODER_TEST_BINARY=$exe uv run pytest -q tests/test_terminal_package.py
      - name: Package the extension with it
        working-directory: vscode
        run: npm ci
      - run: uv run python packaging/vsix.py
      - name: The copy inside the extension runs too (links copied as files)
        shell: bash
        run: |
          exe=vscode/bin/cmcoder/cmcoder; [ "$RUNNER_OS" = Windows ] && exe=vscode/bin/cmcoder/cmcoder.exe
          CMCODER_TEST_BINARY=$exe CMCODER_TEST_NO_PYTHON=1 uv run pytest -q tests/test_standalone.py
      - name: The extension in a real VS Code, using the bundled cmcoder (Linux)
        if: runner.os == 'Linux'
        working-directory: vscode
        env:
          CMCODER_TEST_BUNDLED: "1"
        run: |
          export CMCODER_TEST_PYTHON="$(uv run python -c 'import sys; print(sys.executable)')"
          command -v import >/dev/null || sudo apt-get install -y -q imagemagick  # screenshots for the guides
          CMCODER_GATE_SHOTS="$RUNNER_TEMP/vscode-shots" xvfb-run -a -s "-screen 0 1280x800x24" npm run test:integration
      - name: Screenshots from VS Code (chat, a diff, the navigator)
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: gate-screenshots-vscode
          path: ${{ runner.temp }}/vscode-shots
          if-no-files-found: ignore
      - name: What this platform's gates checked (all passed, or the job failed)
        shell: bash
        run: |
          f=gate-${{ matrix.target }}.txt
          {
            echo "Standalone cmcoder, run as users run it (no Python)"
            echo "IDE core for Eclipse/NetBeans, with this cmcoder"
            echo "Visual Studio core, with this cmcoder"
            echo "Eclipse plugin in a real Eclipse, cmcoder inside"
            echo "NetBeans plugin in a real NetBeans 31, cmcoder inside"
            [ "$RUNNER_OS" = Windows ] && echo "Visual Studio extension in a real Visual Studio, cmcoder inside"
            echo "Terminal package: install, update, run, uninstall"
            echo "VS Code extension: the cmcoder inside it runs"
            [ "$RUNNER_OS" = Linux ] && echo "VS Code extension in a real VS Code, cmcoder inside"
            true
          } > "$f"
      - uses: actions/upload-artifact@v4
        with:
          name: gate-${{ matrix.target }}
          path: gate-${{ matrix.target }}.txt
      - uses: actions/upload-artifact@v4
        with:
          name: cmcoder-${{ matrix.target }}
          path: dist/cmcoder
      - uses: actions/upload-artifact@v4
        with:
          name: cmcoder-terminal-${{ matrix.target }}
          path: dist/terminal/cmcoder-${{ matrix.target }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: cmcoder-${{ matrix.target }}.vsix
          path: vscode/cmcoder-${{ matrix.target }}.vsix

  eclipse-site:
    # The update site developers install from: the plugin and one fragment per
    # platform, each with that platform's cmcoder (from the builds above).
    name: Eclipse update site
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: cmcoder-*-*
          path: programs
      - name: cmcoder into each platform's fragment
        run: |
          set -e
          for p in linux-x64:linux.x86_64 win32-x64:win32.x86_64 darwin-arm64:macosx.aarch64; do
            src=programs/cmcoder-${p%%:*}; dst=eclipse/fragments/cmcoder.eclipse.${p##*:}/bin/cmcoder
            test -d "$src" || { echo "missing $src"; exit 1; }
            cp -R "$src" "$dst"
          done
          chmod +x eclipse/fragments/*/bin/cmcoder/cmcoder
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: The shared chat panel
        working-directory: clients/web-panel
        run: npm ci && npm run build
      - name: Build the update site (the tests ran in the builds above)
        working-directory: eclipse
        run: mvn -B -DskipTests verify
      - name: Every platform's cmcoder is in the site
        working-directory: eclipse/site/target
        run: |
          set -e
          mkdir site && cd site && unzip -q ../cmcoder-eclipse-*.zip
          for f in win32.x86_64:cmcoder.exe linux.x86_64:cmcoder macosx.aarch64:cmcoder; do
            jar=$(ls plugins/cmcoder.eclipse.${f%%:*}_*.jar)
            unzip -l "$jar" | grep -q " bin/cmcoder/${f##*:}$" || { echo "no cmcoder in $jar"; exit 1; }
          done
      - uses: actions/upload-artifact@v4
        with:
          name: cmcoder-eclipse
          path: eclipse/site/target/cmcoder-eclipse-*.zip

  bundle:
    # Every file in one folder, only when every build and gate passed.
    needs: [build, eclipse-site]
    name: Release bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Assemble the bundle
        run: |
          uv run --no-project python packaging/bundle.py --artifacts artifacts --out bundle
          cat bundle/GATE-REPORT.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: cmcoder-release-bundle
          path: bundle
      - name: A GitHub release (version tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd bundle
          gh release create "$GITHUB_REF_NAME" --title "cmcoder $GITHUB_REF_NAME" --notes-file GATE-REPORT.md \
            README-FIRST.txt GATE-REPORT.md SHA256SUMS.txt */*
