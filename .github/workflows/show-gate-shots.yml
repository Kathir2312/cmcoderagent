# One-off: prints the Visual Studio gate screenshots of release build #63 into the
# log (base64), for viewers that can read logs but not artifact storage. Removed
# after use.
name: Show gate screenshots
on:
  push:
    paths: [".github/workflows/show-gate-shots.yml"]
permissions:
  actions: read
jobs:
  show:
    runs-on: ubuntu-latest
    steps:
      - name: The screenshots as base64
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 37505269839 -R "$GITHUB_REPOSITORY" -n gate-screenshots-win32-x64 -D shots
          ls -la shots
          for f in shots/visualstudio-*.png; do
            echo "=== BEGIN $(basename "$f")"
            base64 -w 76 "$f"
            echo "=== END $(basename "$f")"
          done
