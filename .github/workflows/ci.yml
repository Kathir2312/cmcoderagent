name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python-version: "3.11" }
          - { os: ubuntu-latest, python-version: "3.12" }
          - { os: macos-latest, python-version: "3.12" }
          - { os: windows-latest, python-version: "3.11" }
          - { os: windows-latest, python-version: "3.12" }
    steps:
      - uses: actions/checkout@v4
      - name: Install ripgrep and bubblewrap (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y ripgrep bubblewrap
          # Ubuntu 24.04 restricts unprivileged user namespaces, which bubblewrap needs.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: Install ripgrep (macOS)
        if: runner.os == 'macOS'
        run: brew install ripgrep
      # Windows: no ripgrep on purpose, so the built-in search fallback is what
      # runs there. Git Bash comes with the runner image, as on most dev machines.
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync
      - name: Lint
        run: |
          uv run ruff check src tests evals packaging
          uv run ruff format --check src tests evals packaging
      - name: Type check
        run: uv run pyright
      - name: Show environment (cmcoder doctor, local checks)
        run: uv run cmcoder doctor --no-probe
        continue-on-error: true
      - name: Tests
        run: uv run pytest -q
      - name: Evals (scripted model), through -p and the VS Code protocol, with a parity check
        run: uv run python evals/run.py --mock --via both
      - name: Evals (scripted model) served the way Open WebUI serves an Ollama model
        run: uv run python evals/run.py --mock --gateway openwebui-ollama
      - name: Code search quality harness (mock embeddings; real scores need a real model)
        run: uv run python evals/retrieval.py --mock

  litellm-gateway:
    name: integration (real LiteLLM proxy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync
      - name: Install LiteLLM proxy (separate venv)
        run: |
          uv venv /tmp/litellm --python 3.12
          uv pip install --python /tmp/litellm/bin/python 'litellm[proxy]'
      - name: Gateway tests
        run: LITELLM_BIN=/tmp/litellm/bin/litellm uv run pytest -q tests/test_litellm_integration.py

  chroma:
    name: code search stores (real Chroma)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --extra chroma
      - name: Start a Chroma server
        run: |
          (uv run --no-sync chroma run --path /tmp/chroma-data --port 8765 > /tmp/chroma.log 2>&1 &)
          for i in $(seq 60); do curl -sf http://localhost:8765/api/v2/heartbeat && break; sleep 1; done; curl -sf http://localhost:8765/api/v2/heartbeat
      - name: Index tests on the built-in store, a Chroma server and Chroma on this machine
        env:
          CMCODER_TEST_CHROMA_URL: http://localhost:8765
        run: uv run --no-sync pytest -q tests/test_rag_index.py
      - if: failure()
        run: tail -50 /tmp/chroma.log

  vscode:
    name: VS Code extension (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: vscode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            vscode/package-lock.json
            clients/web-panel/package-lock.json
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --project ..
      - run: npm ci  # also installs the shared panel's packages (postinstall)
      - name: Type check
        run: npm run typecheck
      - name: Type check the shared panel (clients/web-panel)
        working-directory: clients/web-panel
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Browser for the chat panel tests
        working-directory: clients/web-panel
        run: npx playwright install ${{ runner.os == 'Linux' && '--with-deps' || '' }} chromium
      - name: The shared panel, as each IDE connects to it (VS Code, WebView2, JCEF/SWT)
        working-directory: clients/web-panel
        run: npm test
      # The tests start cmcoder with this Python. (`uv run npm ...` can't start
      # npm on Windows, where it is npm.cmd.)
      - name: cmcoder's Python for the tests
        shell: bash
        run: echo "CMCODER_TEST_PYTHON=$(uv run --project .. python -c 'import sys; print(sys.executable)')" >> "$GITHUB_ENV"
      - name: Tests (against the real cmcoder and the mock model server)
        run: npm test
      - name: Integration tests in a real VS Code
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:integration
      - name: Package
        if: runner.os == 'Linux'
        run: npm run package
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: cmcoder-vsix
          path: vscode/cmcoder.vsix

  jvm-core:
    # The IDE core shared by the JetBrains and Eclipse plugins (clients/jvm-core),
    # on the oldest Java it supports. Its tests start cmcoder from source here
    # (macOS, Linux); on Windows that needs the standalone cmcoder.exe, so the
    # Release build runs all of them there (with no Python in reach).
    name: IDE core for JetBrains/Eclipse (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync
      - name: Tests
        shell: bash
        run: |
          export CMCODER_TEST_PYTHON="$(uv run python -c 'import sys; print(sys.executable)')"
          mvn -B -f clients/jvm-core/pom.xml verify

  visualstudio-core:
    # The C# core of the Visual Studio extension (visualstudio/src/Cmcoder.Core),
    # against cmcoder from source here; the Release build runs it on Windows with
    # the standalone cmcoder.exe and no Python in reach.
    name: Visual Studio core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync
      - name: Tests
        shell: bash
        run: |
          export CMCODER_TEST_PYTHON="$(uv run python -c 'import sys; print(sys.executable)')"
          dotnet build visualstudio/src/Cmcoder.Core -c Release
          dotnet test visualstudio/test/Cmcoder.Core.Tests -c Release --logger "console;verbosity=normal"

  visualstudio-extension:
    # The Visual Studio extension builds and packs (Windows, Visual Studio's
    # MSBuild); the Release build runs it in a real Visual Studio.
    name: Visual Studio extension (build)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: The shared chat panel
        working-directory: clients/web-panel
        run: npm ci && npm run build
      - name: Build the .vsix (and the gate build)
        shell: pwsh
        run: |
          ./visualstudio/build-vsix.ps1
          ./visualstudio/build-vsix.ps1 -Gate

  eclipse:
    # The Eclipse plugin (eclipse/) in a real Eclipse, oldest and newest supported,
    # with its real chat page, cmcoder from source and the mock model server. The
    # Release build runs it again on every platform with the bundled cmcoder.
    name: Eclipse plugin (${{ matrix.os }}, ${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: oldest }
          - { os: ubuntu-latest, target: newest }
          - { os: macos-latest, target: oldest }
    steps:
      - uses: actions/checkout@v4
      - name: A browser engine for Eclipse (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync
      - name: The shared chat panel
        working-directory: clients/web-panel
        run: npm ci && npm run build
      - name: Build and test
        working-directory: eclipse
        shell: bash
        run: |
          export CMCODER_TEST_PYTHON="$(uv run python -c 'import sys; print(sys.executable)')"
          run=""; [ "$RUNNER_OS" = Linux ] && run="xvfb-run -a"
          $run mvn -B -Dtarget=${{ matrix.target }} verify

  security:
    name: security (SAST + dependency audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: vscode/package-lock.json
      - name: Bandit (Python SAST; fails on medium or high severity)
        run: uvx bandit -r src evals/run.py --severity-level medium
      - name: pip-audit (known vulnerabilities in the locked Python packages)
        run: |
          uv export --format requirements-txt --no-hashes --no-emit-project --all-extras > /tmp/requirements.txt
          # chromadb (the optional "chroma" extra): server-side advisories with no fix
          # yet; cmcoder only uses it as an in-process client. See
          # docs/phase5/SECURITY-REVIEW.md, finding 2, before removing or adding any.
          uvx pip-audit -r /tmp/requirements.txt --no-deps --disable-pip --strict \
            --ignore-vuln PYSEC-2026-311 --ignore-vuln PYSEC-2026-3813 \
            --ignore-vuln PYSEC-2026-3814 --ignore-vuln PYSEC-2026-3815
      - name: npm audit (extension and shared panel dependencies; fails on high or critical)
        working-directory: vscode
        run: |
          npm ci
          npm audit --audit-level=high
          cd ../clients/web-panel && npm audit --audit-level=high
